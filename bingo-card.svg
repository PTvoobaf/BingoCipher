<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" role="img" aria-labelledby="title desc">
  <title id="title">Winning Bingo Card</title>
  <desc id="desc">A 5 by 5 bingo card. Daubed cells have a light lavender outline; the center cell is a free space.</desc>
  <rect width="900" height="1040" fill="#ffffff"/>
  <defs>
    <filter id="hand-drawn" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="18" fill="#30303a">BINGO</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- column headers -->
    <g font-size="34" font-weight="700" fill="#30303a">
      <text x="120" y="145">B</text><text x="285" y="145">I</text><text x="450" y="145">N</text><text x="615" y="145">G</text><text x="780" y="145">O</text>
    </g>
    <!-- card cells -->
    <g fill="#fbfbfd" stroke="#3f3f49" stroke-width="3">
      <rect x="40"  y="170" width="160" height="160"/><rect x="205" y="170" width="160" height="160"/><rect x="370" y="170" width="160" height="160"/><rect x="535" y="170" width="160" height="160"/><rect x="700" y="170" width="160" height="160"/>
      <rect x="40"  y="330" width="160" height="160"/><rect x="205" y="330" width="160" height="160"/><rect x="370" y="330" width="160" height="160"/><rect x="535" y="330" width="160" height="160"/><rect x="700" y="330" width="160" height="160"/>
      <rect x="40"  y="490" width="160" height="160"/><rect x="205" y="490" width="160" height="160"/><rect x="370" y="490" width="160" height="160"/><rect x="535" y="490" width="160" height="160"/><rect x="700" y="490" width="160" height="160"/>
      <rect x="40"  y="650" width="160" height="160"/><rect x="205" y="650" width="160" height="160"/><rect x="370" y="650" width="160" height="160"/><rect x="535" y="650" width="160" height="160"/><rect x="700" y="650" width="160" height="160"/>
      <rect x="40"  y="810" width="160" height="160"/><rect x="205" y="810" width="160" height="160"/><rect x="370" y="810" width="160" height="160"/><rect x="535" y="810" width="160" height="160"/><rect x="700" y="810" width="160" height="160"/>
    </g>
    <!-- light lavender outlines indicate daubed cells; center is the free space -->
    <g fill="none" stroke="#9f83c9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand-drawn)">
      <ellipse cx="120" cy="250" rx="62" ry="58"/><ellipse cx="285" cy="250" rx="62" ry="58"/><ellipse cx="615" cy="250" rx="62" ry="58"/><ellipse cx="780" cy="250" rx="62" ry="58"/>
      <ellipse cx="285" cy="410" rx="62" ry="58"/>
      <ellipse cx="615" cy="730" rx="62" ry="58"/>
      <ellipse cx="450" cy="570" rx="66" ry="62" fill="#f0eafb"/>
      <ellipse cx="615" cy="890" rx="62" ry="58"/><ellipse cx="780" cy="890" rx="62" ry="58"/>
    </g>
    <!-- numbers, shown without the sign used in the input notation -->
    <g font-size="42" fill="#30303a">
      <text x="120" y="265">15</text><text x="285" y="265">29</text><text x="450" y="265">33</text><text x="615" y="265">46</text><text x="780" y="265">68</text>
      <text x="120" y="425">5</text><text x="285" y="425">16</text><text x="450" y="425">34</text><text x="615" y="425">47</text><text x="780" y="425">75</text>
      <text x="120" y="585">4</text><text x="285" y="585">19</text><text x="450" y="585" font-size="30" font-weight="700">FREE</text><text x="615" y="585">54</text><text x="780" y="585">63</text>
      <text x="120" y="745">9</text><text x="285" y="745">20</text><text x="450" y="745">41</text><text x="615" y="745">49</text><text x="780" y="745">74</text>
      <text x="120" y="905">13</text><text x="285" y="905">24</text><text x="450" y="905">32</text><text x="615" y="905">50</text><text x="780" y="905">62</text>
    </g>
  </g>
</svg>
